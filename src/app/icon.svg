<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A calculator with STUNT on the screen: the app in one glyph.
       Brand colors: stunt red #c0392b, app teal #5cb8a5, dark body. -->
  <rect x="4" y="2" width="56" height="60" rx="10" fill="#232326"/>
  <rect x="4" y="2" width="56" height="60" rx="10" fill="none" stroke="#3d3d42" stroke-width="2"/>
  <!-- Screen -->
  <rect x="10" y="9" width="44" height="16" rx="4" fill="#101012"/>
  <text x="32" y="21.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="10.5" letter-spacing="0.5" fill="#c0392b">STUNT</text>
  <!-- Keys: three rows, the equals key in the app's teal -->
  <g fill="#3f3f44">
    <rect x="10" y="30" width="12" height="8" rx="2.5"/>
    <rect x="26" y="30" width="12" height="8" rx="2.5"/>
    <rect x="42" y="30" width="12" height="8" rx="2.5"/>
    <rect x="10" y="42" width="12" height="8" rx="2.5"/>
    <rect x="26" y="42" width="12" height="8" rx="2.5"/>
    <rect x="42" y="42" width="12" height="8" rx="2.5"/>
    <rect x="10" y="54" width="12" height="4" rx="2"/>
    <rect x="26" y="54" width="12" height="4" rx="2"/>
  </g>
  <rect x="42" y="54" width="12" height="4" rx="2" fill="#5cb8a5"/>
</svg>
